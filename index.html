<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F3A5F" />
  <meta name="description" content="1日3分から、ビジネス英単語をフラッシュカードと復習で学ぶ Word Boost。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Word Boost" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icon-32.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Word Boost | ビジネス英単語</title>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="Word Boost"><img src="./assets/icon-192.png" alt="" /> <span>Word Boost</span></div>
      <button class="icon-btn" id="settings-button" type="button" data-action="settings" aria-label="設定を開く">⚙</button>
    </header>
    <main id="main-content" tabindex="-1"><div class="loading">単語を準備しています…</div></main>
    <nav class="bottom-nav" aria-label="メインメニュー">
      <button data-tab="home" class="nav-btn selected"><span class="nav-symbol">⌂</span><span>ホーム</span></button>
      <button data-tab="words" class="nav-btn"><span class="nav-symbol">▤</span><span>学習</span></button>
      <button data-tab="test" class="nav-btn"><span class="nav-symbol">◉</span><span>テスト</span></button>
      <button data-tab="record" class="nav-btn"><span class="nav-symbol">▥</span><span>記録</span></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
